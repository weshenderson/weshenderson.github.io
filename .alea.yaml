configs:
    website: 'configs/website.yaml'
    resume: 'configs/resume.yaml'
    buildData: 'templates/.build.metadata'
    templatesDir: 'templates'
    docker:
        pdf:
            project_directory: 'docker/pdf_resume'
templates:
    website:
        html:
            source: 'index.html.j2'
            destination: 'public/index.html'
        css:
            source: 'main.css.j2'
            destination: 'public/assets/css/main.css'
    resume:
        html:
            source: 'resume.html.j2'
            destination: 'public/resumes/resume.html'
        md:
            source: 'resume.md.j2'
            destination: 'public/resumes/resume.md'
        docx:
            source: false
            destination: 'public/resumes/resume.docx'
        pdf:
            source: false
            destination: 'public/resumes/resume.pdf'
        json:
            source: false
            destination: 'public/resumes/resume.json'
