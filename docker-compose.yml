services:
  pdf:
    build: .
    working_dir: /tmp/
    command: >
        /chrome-headless
          --no-sandbox
          --headless
          --disable-gpu
          --no-pdf-header-footer
          --no-margins
          --run-all-compositor-stages-before-draw
          --print-to-pdf=${OUTPUT}
          ${TMP}
    volumes:
        - ./resumes:/tmp/resumes
        - ./assets:/tmp/assets

    # Interactive Shell for Troubleshooting
    #stdin_open: true # docker run -i
    #tty: true        # docker run -t
