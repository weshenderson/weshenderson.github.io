name: "Test"

on: [push]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - name: Checkout Repository.
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies.
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        pip install -r requirements.txt

    - name: "Pylint: Analysing code."
      run: |
        pylint $(git ls-files '*.py')

    - name: Check for resume changes.
      id: resume_updates
      uses: dorny/paths-filter@v3
      with:
        filters: |
          specific_file:
            - 'configs/resume.yaml'

    - name: "Alea: Validating resume schema."
      if: steps.resume_updates.outputs.specific_file == 'true'
      run: |
        python ./alea.py --validate --resume

    - name: Check for website changes.
      id: website_updates
      uses: dorny/paths-filter@v3
      with:
        filters: |
          specific_file:
            - 'configs/website.yaml'

    - name: "Alea: Validating website schema."
      if: steps.website_updates.outputs.specific_file == 'true'
      run: |
        python ./alea.py --validate --website
